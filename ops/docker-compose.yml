# Local development stack for FilsPay: Postgres plus the three services that
# talk to it directly (apps/api, apps/settlement, apps/reporting), with
# one-off migrate and seed jobs. apps/web and apps/admin are Vite dev servers
# run outside compose (`npm run dev` in each).
#
# First run, from ops/:
#   ./postgres/gen-certs.sh        # local CA + Postgres TLS cert (gitignored)
#   cp, or create, ops/.env         # secrets and DB passwords (gitignored)
#   docker compose up --build -d
#
# Settings come from each service's `environment:` below, interpolated from
# ops/.env. Compose does not read ops/.env.docker.
#
# Hosting (docs/HOSTING.md): the same file runs locally and on the 1 vCPU /
# 2 GB host. Only `proxy` publishes ports (80/443/8443, TLS); Postgres is not
# reachable from outside. Long-running services restart themselves, and each
# has a CPU/memory cap; the api's is the required 0.5 vCPU / 512 MB.
#
# Database access (docs/BUGFIXES.md #49, #50):
# - every network connection is TLS, verified against the local CA
#   (sslmode=verify-full); plain connections are rejected by pg_hba.conf;
# - each service has its own role with only the grants it needs
#   (db/migrations/0079_service_roles.sql); migrate and seed use the owner.

x-db-ca: &db-ca ./postgres/certs/ca.crt:/certs/ca.crt:ro
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # bounded, or logs fill the disk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in ops/.env}
      POSTGRES_DB: filspay
      FILSPAY_API_DB_PASSWORD: ${FILSPAY_API_DB_PASSWORD:?set it in ops/.env}
      FILSPAY_SETTLEMENT_DB_PASSWORD: ${FILSPAY_SETTLEMENT_DB_PASSWORD:?set it in ops/.env}
      FILSPAY_REPORTING_DB_PASSWORD: ${FILSPAY_REPORTING_DB_PASSWORD:?set it in ops/.env}
    # Postgres requires the key to be owned by its own user with mode 0600, so
    # copy the mounted files into place before handing over to the image's
    # normal entrypoint.
    entrypoint:
      - sh
      - -c
      - >-
        install -o postgres -g postgres -m 600 /tls/server.key /tmp/server.key &&
        install -o postgres -g postgres -m 644 /tls/server.crt /tmp/server.crt &&
        install -o postgres -g postgres -m 644 /tls/pg_hba.conf /tmp/pg_hba.conf &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
        -c hba_file=/tmp/pg_hba.conf
        -c max_connections=50 -c shared_buffers=128MB -c effective_cache_size=384MB
    # No published port: only the services on this network can reach it.
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 640m
    logging: *logging
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
      - ./postgres/certs/server.crt:/tls/server.crt:ro
      - ./postgres/certs/server.key:/tls/server.key:ro
      - ./postgres/pg_hba.conf:/tls/pg_hba.conf:ro
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off: applies db/migrations/*.sql, then exits. Re-run any time; the
  # runner skips migrations already recorded in schema_migrations. Runs as the
  # owner role (it creates tables and grants).
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=verify-full&sslrootcert=/certs/ca.crt
    volumes: [*db-ca]
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: deterministic seed data. It TRUNCATEs its fixture tables, so it
  # skips itself when the database already has merchants (SEED_RESET=true to
  # force); otherwise every `up` on a hosted box wiped real data.
  seed:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=verify-full&sslrootcert=/certs/ca.crt
      # The seed loads apps/api's config (it encrypts webhook secrets).
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set it in ops/.env}
      SEED_RESET: ${SEED_RESET:-false}
      # The defaults are public (db/seed/generate.ts). Set both on a hosted box.
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes: [*db-ca]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    # Loopback only, for the Vite dev servers; the public path is via proxy.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://filspay_api:${FILSPAY_API_DB_PASSWORD}@postgres:5432/filspay?sslmode=verify-full&sslrootcert=/certs/ca.crt
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set it in ops/.env}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set it in ops/.env}
      ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET:?set it in ops/.env}
      CHECKOUT_BASE_URL: https://${PUBLIC_HOST:-localhost}
      TRUST_PROXY: "true"
      # Capacity guard (docs/CAPACITY.md): past this many concurrent requests
      # the api answers 503 + Retry-After instead of queueing.
      API_MAX_IN_FLIGHT: ${API_MAX_IN_FLIGHT:-48}
      API_REQUEST_TIMEOUT_MS: "15000"
      PG_POOL_CONNECTION_TIMEOUT_MS: "2000"
      # Capture and pay hold a connection across the acquirer call (row lock,
      # by design), so the pool, not CPU, capped checkout at ~6/s with 5.
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      # Keep connections: a new one costs a TLS + SCRAM handshake on 0.5 vCPU.
      PG_POOL_IDLE_TIMEOUT_MS: "300000"
      # V8 heap below the 512 MB cgroup cap, so GC runs before an OOM kill.
      NODE_OPTIONS: --max-old-space-size=320
      # No email/SMS channel exists; without this nobody can log in to a
      # hosted stack. Demo only (docs/HOSTING.md).
      OTP_LOG_CODES: ${OTP_LOG_CODES:-false}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    volumes: [*db-ca]
    depends_on:
      seed:
        condition: service_completed_successfully

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    # Exits at boot without SETTLEMENT_INTERNAL_TOKEN; must match the api's.
    command: ["./settlement", "daemon"]
    environment:
      DATABASE_URL: postgres://filspay_settlement:${FILSPAY_SETTLEMENT_DB_PASSWORD}@postgres:5432/filspay?sslmode=verify-full&sslrootcert=/certs/ca.crt
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set it in ops/.env}
      # PGCONN_SETTLEMENT is not set on purpose: when set it *overrides*
      # DATABASE_URL (internal/config/config.go).
    restart: unless-stopped
    cpus: 0.15
    mem_limit: 128m
    logging: *logging
    volumes: [*db-ca]
    depends_on:
      seed:
        condition: service_completed_successfully

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # No subcommand = `worker`.
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    environment:
      DATABASE_URL: postgres://filspay_reporting:${FILSPAY_REPORTING_DB_PASSWORD}@postgres:5432/filspay?sslmode=verify-full&sslrootcert=/certs/ca.crt
      NODE_OPTIONS: --max-old-space-size=128
    restart: unless-stopped
    cpus: 0.1
    mem_limit: 224m
    logging: *logging
    volumes: [*db-ca]
    depends_on:
      seed:
        condition: service_completed_successfully

  # TLS termination, per-IP rate limits, and the built web + admin frontends.
  proxy:
    build:
      context: ..
      dockerfile: ops/Dockerfile.proxy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/tls:/etc/nginx/tls:ro
    restart: unless-stopped
    cpus: 0.15
    mem_limit: 64m
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

volumes:
  filspay_pgdata:
