# Public entry point (docs/HOSTING.md). Only this container publishes ports.
#   443  merchant dashboard + hosted checkout + /v1 API
#   8443 admin console + /v1 API (separate origin, separate cookies)
#   80   redirects to https
worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;

    # Per-client-IP limits. The API's own load shedding (API_MAX_IN_FLIGHT)
    # is the global capacity guard; these stop one client taking all of it.
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=100r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    client_max_body_size 9m;          # KYC upload limit is 8 MiB
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          15s;
    keepalive_timeout     30s;

    upstream api {
        server api:3000 max_fails=0;
        keepalive 16;
        keepalive_timeout 4s;         # below the API's 5 s keepAliveTimeout
    }

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    server {
        listen 80;
        location / { return 301 https://$host$request_uri; }
    }

    # Upstream settings shared by both servers are in proxy_api.conf.
    server {
        listen 443 ssl;
        http2 on;
        root /usr/share/nginx/web;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        limit_conn perip 50;

        location /v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            include /etc/nginx/proxy_api.conf;
        }
        location /v1/ {
            limit_req zone=api burst=200 nodelay;
            include /etc/nginx/proxy_api.conf;
        }
        location = /healthz { include /etc/nginx/proxy_api.conf; }
        location / { try_files $uri /index.html; }
    }

    server {
        listen 8443 ssl;
        http2 on;
        root /usr/share/nginx/admin;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        limit_conn perip 50;

        location /v1/admin/auth/ {
            limit_req zone=auth burst=20 nodelay;
            include /etc/nginx/proxy_api.conf;
        }
        location /v1/ {
            limit_req zone=api burst=200 nodelay;
            include /etc/nginx/proxy_api.conf;
        }
        location / { try_files $uri /index.html; }
    }
}
